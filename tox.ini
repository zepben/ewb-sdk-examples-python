[tox]
envlist =
    py{3.13, 3.12, 3.11, 3.10}
    build

[testenv]
passenv = GITHUB_*
pip_pre = true
extras = test
depends =
    build: py{3.13, 3.12, 3.11, 3.10}
commands =
    python -m pip install build
    python -m build

[testenv:build]
basepython = py3.10
commands =
    python -m pip install build
    python -m build

